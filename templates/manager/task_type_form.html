{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <div class="row">
    <div class="py-4">
      {% include "includes/breadcrumb.html" with breadcrumbs=breadcrumbs %}

      <div class="d-flex justify-content-between w-100 flex-wrap">
        <div class="mb-3 mb-lg-0">
          <h1 class="h4">{{ object|yesno:"Update,Create" }} task type</h1>
        </div>
      </div>
    </div>

    <div class="col-12 col-xl-8">
      <div class="card border-0 shadow">
        <div class="card-body">
          <form method="post">
            {% csrf_token %}

            {{ form|crispy }}

            <div class="mt-4">
              <button type="submit" class="btn btn-primary">
                Save task type
              </button>

              <a href="{% url 'manager:task-type-list' %}"
                 class="btn btn-gray-200">
                Cancel
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
